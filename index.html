<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시설지원과 업무 흐름지도 | 예산편성 - 준공</title>
<style>
  :root {
    --bg: #f7f6f2;
    --card: #ffffff;
    --border: #e3e0d7;
    --border-strong: #c9c5b8;
    --text-primary: #232220;
    --text-secondary: #6b6a63;
    --text-muted: #97958c;
    --accent: #246bfd;
    --accent-bg: #e9f0ff;
    --warn: #b45309;
    --warn-bg: #fef3e2;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    line-height: 1.6;
  }
  header {
    max-width: 880px;
    margin: 0 auto;
    padding: 48px 24px 24px;
  }
  header .eyebrow {
    font-size: 13px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 8px;
  }
  header h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 8px;
  }
  header p {
    color: var(--text-secondary);
    font-size: 15px;
    margin: 0;
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }
  .stepper {
    display: flex;
    gap: 8px;
    margin: 24px 0 32px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .step-dot {
    flex: 1;
    min-width: 100px;
    padding: 10px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .step-dot.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .stage-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 28px 8px;
    margin-bottom: 40px;
  }
  .stage-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 4px;
  }
  .stage-num {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 2px 10px;
    border-radius: 999px;
  }
  .stage-title {
    font-size: 20px;
    font-weight: 700;
  }
  .stage-desc {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 20px;
  }
  .section-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 20px 0 10px;
  }
  ul.task-list {
    margin: 0 0 8px;
    padding-left: 20px;
  }
  ul.task-list li {
    margin-bottom: 6px;
    font-size: 14.5px;
  }
  .caution-box {
    background: var(--warn-bg);
    border: 1px solid #f2d9ae;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .caution-box .caution-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--warn);
    margin-bottom: 8px;
  }
  .caution-box ul {
    margin: 0;
    padding-left: 18px;
  }
  .caution-box li {
    font-size: 13.5px;
    color: #6b4a1f;
    margin-bottom: 6px;
  }
  .caution-box li:last-child { margin-bottom: 0; }
  .ref-note {
    font-size: 12px;
    color: var(--text-muted);
    border-top: 1px dashed var(--border);
    padding: 14px 0 20px;
    margin-top: 8px;
  }
  footer {
    max-width: 880px;
    margin: 0 auto;
    padding: 24px 24px 60px;
    font-size: 12.5px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
  }
  @media print {
    .stepper { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">시설지원과 업무 흐름지도</div>
  <h1>예산 편성부터 준공까지</h1>
  <p>전기 · 통신 · 소방 학교시설공사 5단계 처리 절차와 단계별 유의사항</p>
</header>

<main>
  <div class="stepper" id="stepper"></div>
  <div id="stages"></div>
</main>

<footer>
  본 자료는 실무 참고용으로 작성되었으며, 법적 효력이 없습니다. 정확한 기준은 관련 법령·교육청 지침·조달청 시설공사 적격심사세부기준을 반드시 확인하세요.
</footer>

<script>
const stages = [
  {
    num: 1,
    title: "예산 편성",
    desc: "사업 계획 수립부터 예산 요구·확정까지",
    tasks: [
      "학교 현장 수요조사 및 노후도·위험도 우선순위 파악",
      "사업 기본계획 수립 (공사 범위, 개략 사업비 산정)",
      "설계·감리 용역비 적정 산출",
      "본예산 또는 추경(추가경정예산) 편성 요구",
      "K-에듀파인 예산 편성 등록"
    ],
    cautions: [
      "사업 기본계획을 형식적으로만 수립하지 않았는지 (수요조사·현장 확인 누락 여부)",
      "설계·감리 용역비를 관련 요율 기준 없이 임의로 산정하지 않았는지",
      "동일 성격 사업을 분할하여 소액수의계약 기준(전기·통신·소방 1.6억 이하 등)을 회피하지 않았는지"
    ]
  },
  {
    num: 2,
    title: "계약",
    desc: "설계·발주부터 입찰·계약 체결까지",
    tasks: [
      "설계 용역 발주 및 설계도서(도면·시방서·물량내역서) 작성",
      "예정가격 및 공사원가계산서 산정 — 계약심사 요청",
      "입찰 공고 (추정가격에 따른 적격심사 기준 적용)",
      "낙찰자 결정 및 계약 체결",
      "계약보증금·하도급 관리계획 확인"
    ],
    cautions: [
      "설계도면·시방서·물량내역서가 상호 불일치하여 누락 비목이 발생하지 않았는지",
      "추정가격 구간별 적격심사 세부기준(별표 1~5)을 올바르게 적용했는지 — 전기·통신·소방은 일반공사와 기준 금액이 다름에 유의",
      "계약심사(예정가격·설계변경 증감액) 절차를 누락하지 않았는지",
      "수의계약 사유 및 금액 기준(추정가격 1.6억원 이하 등)을 정확히 적용했는지"
    ]
  },
  {
    num: 3,
    title: "착공",
    desc: "착공계 접수부터 현장 여건 확인까지",
    tasks: [
      "착공계·현장대리인계·안전관리계획서 접수 및 검토",
      "현장 설명 및 인허가 사항 확인 (전기안전공사, 소방서 등)",
      "학사일정과 공사기간 조율 (방학 중 시공 원칙 검토)",
      "지장물·용지 확보 여부 확인"
    ],
    cautions: [
      "현장대리인 배치 기준(상주 여부, 자격 요건) 미준수 여부",
      "안전관리계획서 검토 없이 착공을 승인하지 않았는지",
      "수업 중 공사 시행 시 소음·분진 등 안전조치 계획 확인 여부"
    ]
  },
  {
    num: 4,
    title: "감독",
    desc: "시공 감독부터 기성 검사·기성금 지급까지",
    tasks: [
      "공사감독관 지정 및 시공 상태 정기 점검",
      "설계변경 발생 시 계약금액 조정 절차 진행",
      "기성부분 검사 및 기성금 지급",
      "품질관리계획 이행 여부 확인, 자재 승인 관리"
    ],
    cautions: [
      "설계서에 없는 추가 시공비를 물량내역서 비목 추가(설계변경) 없이 임의 정산하지 않았는지",
      "기성검사를 현장 확인 없이 서류로만 처리하지 않았는지",
      "감독일지 작성을 소홀히 하여 하자 발생 시 책임 소재가 불명확해지지 않았는지",
      "설계변경으로 인한 계약금액 조정 시 근거 서류(변경 도면·내역서)를 충분히 갖췄는지"
    ]
  },
  {
    num: 5,
    title: "준공",
    desc: "준공검사부터 정산, 하자보증까지",
    tasks: [
      "준공검사원 접수 및 준공검사 실시",
      "학교시설사업 촉진법에 따른 감독청 신고 및 사용승인",
      "정산 및 최종 대금 지급",
      "하자보증금 예치 및 하자담보책임기간 등록·관리"
    ],
    cautions: [
      "준공검사 없이 사용을 개시하거나 사용승인을 누락하지 않았는지",
      "하자보증금 예치율·기간을 공사 종류별 기준에 맞게 적용했는지",
      "하자담보책임기간 중 발생한 하자에 대한 사후관리(정기 점검) 체계가 있는지",
      "준공 후 자산(재물) 등록 및 관재 대장 반영을 누락하지 않았는지"
    ]
  }
];

const stepperEl = document.getElementById('stepper');
const stagesEl = document.getElementById('stages');

stages.forEach((s, i) => {
  const dot = document.createElement('div');
  dot.className = 'step-dot' + (i === 0 ? ' active' : '');
  dot.textContent = s.num + '. ' + s.title;
  dot.onclick = () => {
    document.getElementById('stage-' + s.num).scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  stepperEl.appendChild(dot);

  const card = document.createElement('div');
  card.className = 'stage-card';
  card.id = 'stage-' + s.num;
  card.innerHTML = `
    <div class="stage-header">
      <span class="stage-num">${s.num}단계</span>
      <span class="stage-title">${s.title}</span>
    </div>
    <div class="stage-desc">${s.desc}</div>
    <div class="section-label">주요 업무</div>
    <ul class="task-list">${s.tasks.map(t => `<li>${t}</li>`).join('')}</ul>
    <div class="caution-box">
      <div class="caution-title">유의사항 · 감사 대비 체크포인트</div>
      <ul>${s.cautions.map(c => `<li>${c}</li>`).join('')}</ul>
    </div>
    <div class="ref-note">근거: 지방계약법령, 조달청 시설공사 적격심사세부기준, 학교시설사업 촉진법 등 — 세부 기준은 최신 법령 및 교육청 계약심사 지침 확인 필요</div>
  `;
  stagesEl.appendChild(card);
});

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const num = entry.target.id.split('-')[1];
      document.querySelectorAll('.step-dot').forEach((d, i) => {
        d.classList.toggle('active', stages[i].num == num);
      });
    }
  });
}, { threshold: 0.3, rootMargin: '-100px 0px -60% 0px' });

document.querySelectorAll('.stage-card').forEach(c => observer.observe(c));
</script>

</body>
</html>
